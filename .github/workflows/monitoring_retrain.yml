name: Model Monitoring & Retraining Workflow

on:
  workflow_dispatch:

jobs:
  run-monitoring-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monitoring, Retraining & Quality Gate Workflow
        run: |
          python -m mlops.monitoring_retrain_workflow

      - name: Display Evaluation Report & Quality Gate Decision
        run: |
          echo "=== EVALUATION REPORT ==="
          cat reports/evaluation_report.json
          echo ""
          echo "=== QUALITY GATE DECISION ==="
          cat reports/quality_gate_decision.json

      - name: Upload Reports & Candidate Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlops-assessment-evidence
          path: |
            reports/
            artifacts/
